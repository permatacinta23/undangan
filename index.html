<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e3d9;font-family:Georgia,serif}body{display:grid;place-items:center;min-height:100dvh}.stage{position:relative;width:min(100vw,70.588dvh);height:min(141.667vw,100dvh);overflow:hidden;background:#e9e3d9}.stage video{width:100%;height:100%;object-fit:contain;display:block}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(22,24,19,.30);transition:opacity .8s ease}.overlay.hidden{opacity:0;pointer-events:none}.open{border:1px solid rgba(255,255,255,.85);border-radius:50px;padding:15px 30px;background:rgba(35,37,31,.65);color:#fff;letter-spacing:.12em;font:15px Georgia,serif;cursor:pointer;box-shadow:0 6px 25px #0003}.music{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border:1px solid #ffffffaa;background:#252c26b8;color:white;border-radius:50%;height:46px;width:46px;display:none;place-items:center;font-size:20px;cursor:pointer}.music.visible{display:grid}.hint{position:absolute;left:12px;right:12px;bottom:15%;color:white;text-align:center;font-size:12px;text-shadow:0 1px 4px #000;pointer-events:none;opacity:0}.hint.visible{opacity:1}
</style></head>
<body>
<div class="stage">
<video id="video" autoplay muted loop playsinline preload="auto"><source src="Deen.mp4" type="video/mp4"></video>
<div id="overlay" class="overlay"><button id="open" class="open">Open Invitation ✉</button></div>
<button id="musicButton" class="music" aria-label="Pause music" title="Pause music">♫</button>
<div id="hint" class="hint" role="status"></div>
</div>
<audio id="song" preload="auto" loop src="music.mp3"></audio>
<script>
const video=document.getElementById('video'),song=document.getElementById('song'),overlay=document.getElementById('overlay'),musicButton=document.getElementById('musicButton'),hint=document.getElementById('hint');
const startAt=44;
function message(s){hint.textContent=s;hint.classList.add('visible');setTimeout(()=>hint.classList.remove('visible'),3500)}
function seekStart(){if(Number.isFinite(song.duration)&&song.duration>startAt){song.currentTime=startAt}else{song.currentTime=startAt}}
function updateButton(){musicButton.textContent=song.paused?'▶':'♫';musicButton.setAttribute('aria-label',song.paused?'Play music':'Pause music');musicButton.title=song.paused?'Play music':'Pause music'}
document.getElementById('open').addEventListener('click',async()=>{overlay.classList.add('hidden');musicButton.classList.add('visible');video.play().catch(()=>{});try{seekStart();await song.play()}catch(e){message('Tap the music button to start the song')}updateButton()});
musicButton.addEventListener('click',async()=>{if(song.paused){try{if(song.currentTime<startAt)seekStart();await song.play()}catch(e){message('Unable to play music')}}else{song.pause()}updateButton()});
song.addEventListener('ended',()=>{seekStart();song.play().catch(()=>{})});
song.addEventListener('timeupdate',()=>{if(Number.isFinite(song.duration)&&song.duration>startAt&&song.currentTime>=song.duration-.15){seekStart()}});
updateButton();
</script></body></html>
