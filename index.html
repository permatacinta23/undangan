<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deen | Invitation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#151515;color:white;font-family:Georgia,serif}body{overflow:hidden}.video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#151515}#cover{position:fixed;inset:0;z-index:2;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;transition:opacity .7s ease}#cover h1{font-size:clamp(26px,6vw,44px);font-weight:400;margin:0}button{font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.7);border-radius:100px;padding:13px 25px;color:#fff;background:rgba(25,25,25,.65);backdrop-filter:blur(10px)}#musicToggle{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:20px;z-index:3;display:none;font-family:system-ui,sans-serif;font-size:13px;padding:11px 16px}#cover.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<video id="video" class="video" autoplay muted loop playsinline preload="auto"><source src="Deen.mp4" type="video/mp4"></video>
<div id="cover"><h1>You're Invited</h1><button id="open">Open Invitation ♡</button></div>
<button id="musicToggle" aria-label="Toggle background music">♫ Pause music</button>
<audio id="music" preload="auto" src="music.mp3"></audio>
<script>
const START=44;
const video=document.getElementById('video');
const music=document.getElementById('music');
const cover=document.getElementById('cover');
const toggle=document.getElementById('musicToggle');
video.play().catch(()=>{});
function label(){toggle.textContent=music.paused?'♫ Play music':'♫ Pause music'}
async function startMusic(){try{if(music.readyState<1)await new Promise(resolve=>{music.addEventListener('loadedmetadata',resolve,{once:true});music.addEventListener('error',resolve,{once:true})});if(Number.isFinite(music.duration)&&music.duration>START)music.currentTime=START;else music.currentTime=START;await music.play()}catch(e){console.warn('Audio could not start:',e)}label()}
document.getElementById('open').addEventListener('click',()=>{cover.classList.add('hidden');toggle.style.display='block';video.play().catch(()=>{});startMusic()});
toggle.addEventListener('click',async()=>{if(music.paused){try{await music.play()}catch(e){console.warn(e)}}else music.pause();label()});
music.addEventListener('ended',()=>{music.currentTime=START;music.play().catch(()=>{});label()});
music.addEventListener('play',label);music.addEventListener('pause',label);
</script>
</body></html>
